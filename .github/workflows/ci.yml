name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reporter
          POSTGRES_PASSWORD: reporter
          POSTGRES_DB: reporter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reporter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://reporter:reporter@localhost:5432/reporter_test

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json's `packageManager` field; setting
      # `version` here too makes action-setup@v4 fail on the duplicate.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install the server/web/term subtrees (skips the Electron desktop app).
      - run: pnpm install --frozen-lockfile --filter "@reporter/web..." --filter "@reporter/server..." --filter "@reporter/term..."

      - name: Lint
        run: pnpm lint

      - name: Build
        run: |
          pnpm --filter @reporter/shared build
          pnpm --filter @reporter/api-client build
          pnpm --filter @reporter/ui build
          pnpm --filter @reporter/web build
          pnpm --filter @reporter/server build
          pnpm --filter @reporter/term build

      - name: Unit tests
        run: pnpm test

      - name: Server integration tests
        run: pnpm --filter @reporter/server test

  # The desktop app is excluded from the job above (its install pulls an Electron
  # binary), so nothing type-checked it and a type error could reach a release
  # tag unnoticed — `electron-vite build` transpiles with esbuild and does not
  # type-check. This job is type-check only: no Electron download, no packaging.
  desktop-typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@reporter/desktop..."
      - run: pnpm --filter "@reporter/shared" --filter "@reporter/ui" --filter "@reporter/api-client" build
      - run: pnpm --filter @reporter/desktop exec tsc --noEmit
