name: Release

# Builds the desktop installers on each OS's native runner (the reliable way to
# produce a proper Windows .exe — Wine on an Apple Silicon dev box can't) plus
# the reporter-term tarball, and attaches them to the tag's GitHub Release.
# Triggers on a version tag, or run manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Required so the built-in GITHUB_TOKEN can create/update the Release and upload assets.
permissions:
  contents: write

jobs:
  # Gate the installers on the test suite. A tag push previously went straight to
  # packaging, so a release could be cut from a commit whose tests were failing —
  # CI runs on pull requests, which a tag push is not.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@reporter/web..." --filter "@reporter/server..." --filter "@reporter/term..."
      - run: pnpm --filter "@reporter/shared" --filter "@reporter/ui" --filter "@reporter/api-client" build
      - run: pnpm lint
      - run: pnpm test

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --universal
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json's `packageManager` field; setting
      # `version` here too makes action-setup@v4 fail on the duplicate.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build the workspace libraries first — they resolve via their compiled
      # dist/ (main/exports), which doesn't exist on a clean checkout, so the
      # desktop bundle can't resolve @reporter/shared|ui|api-client without this.
      - run: pnpm --filter "@reporter/shared" --filter "@reporter/ui" --filter "@reporter/api-client" build
      - run: pnpm --filter @reporter/desktop build
      - name: Package desktop app
        run: pnpm --filter @reporter/desktop exec electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned/ad-hoc builds. Add APPLE/CSC + notarization secrets here for
          # signed releases (macOS), or WIN_CSC_LINK for Windows signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Run-level artifacts (handy for debugging), non-essential. `continue-on-error`
      # so a full Actions artifact-storage quota here can NEVER block the real
      # release publish below — GitHub Release assets use separate storage.
      # `error` still surfaces a glob mismatch loudly; `retention-days` bounds
      # how much these debug copies accumulate against the quota over time.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
      # Attach the installers to the tag's GitHub Release (creates it if absent).
      # Linux ships AppImage (universal), tar.gz (portable, zero-dep), pacman
      # (Arch) and deb (Debian/Ubuntu) so it isn't Ubuntu-only.
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.tar.gz
            apps/desktop/release/*.deb

  terminal:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The term bundle imports the compiled dist/ of these libraries.
      - run: pnpm --filter "@reporter/shared" --filter "@reporter/api-client" build
      - run: pnpm --filter @reporter/term run pack
      # Non-essential debug copy — never let a full artifact-storage quota block
      # the release publish below (Release assets use separate storage).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: reporter-term-tarball
          path: apps/term/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Attach tarball to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/term/*.tgz
